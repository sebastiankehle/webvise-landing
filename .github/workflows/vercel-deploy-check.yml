name: Vercel Deploy Check

on:
  push:
    branches: [main]

jobs:
  check-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        id: deploy
        run: |
          # Poll Vercel API for the latest production deployment
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&teamId=${{ secrets.VERCEL_ORG_ID }}&target=production&limit=1")

            STATE=$(echo "$RESPONSE" | jq -r '.deployments[0].state')
            URL=$(echo "$RESPONSE" | jq -r '.deployments[0].url')
            DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '.deployments[0].uid')

            if [ "$STATE" = "READY" ]; then
              echo "Deployment succeeded: $URL"
              exit 0
            elif [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "state=$STATE" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "Deployment state: $STATE — waiting 20s ($i/30)"
            sleep 20
          done

          echo "state=TIMEOUT" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.deploy.outputs.state }}' || 'UNKNOWN';
            const url = '${{ steps.deploy.outputs.url }}' || 'N/A';
            const deploymentId = '${{ steps.deploy.outputs.deployment_id }}' || 'N/A';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vercel production deploy failed (${state})`,
              labels: ['vercel-build-failure'],
              body: [
                `## Vercel Production Deploy Failure`,
                ``,
                `| Detail | Value |`,
                `|--------|-------|`,
                `| **State** | \`${state}\` |`,
                `| **Deployment** | ${url !== 'N/A' ? `https://${url}` : 'N/A'} |`,
                `| **Deployment ID** | \`${deploymentId}\` |`,
                `| **Commit** | \`${context.sha.substring(0, 7)}\` |`,
                `| **Branch** | \`${context.ref}\` |`,
                `| **Triggered by** | @${context.actor} |`,
                ``,
                `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
            });
